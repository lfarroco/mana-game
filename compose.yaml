# Local multiplayer server (Docker alternative to `make server-mp`) AND the
# production entry point on a VM. Compose runs two services:
#
#   caddy  — TLS reverse proxy (80/443, Let's Encrypt) → server:8787
#   server — the bundled Mana Battle Node server (server/Dockerfile)
#
# Usage (local dev):
#   1. Create a root .env (gitignored) with your publisher key:
#        echo 'MANA_STEAM_WEB_API_KEY=<your-key>' > .env
#   2. docker compose up -d --build     (or: make server-compose-up)
#   3. Launch the Steam Electron build and click MULTIPLAYER — it talks to
#      http://127.0.0.1:8787 by default.
#
# Production (Oracle/DO VM): see server/README.md §Docker flow — point
# api.manabattle.com at the VM (Cloudflare proxied, SSL/TLS mode "Full
# (strict)"), open 80/443 in the security list, then ./server/scripts/deploy.sh.
#
# Optional .env overrides: MANA_SERVER_PORT, MANA_STEAM_APP_IDS,
# MANA_CORS_ORIGIN, MANA_ITCH_ENABLED, MANA_API_DOMAIN. SQLite data lives in
# the named `mana-data` volume and Caddy's TLS certs in `caddy-data` — both
# survive container restarts and redeploys.

name: mana-game

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MANA_API_DOMAIN: "${MANA_API_DOMAIN:-api.manabattle.com}"
    volumes:
      - ./server/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: mana-server:local
    # Host-only: the public path is Caddy on 443. deploy.sh and local tooling
    # still reach the API on 127.0.0.1:8787.
    ports:
      - "127.0.0.1:${MANA_SERVER_PORT:-8787}:8787"
    expose:
      - "8787"
    environment:
      MANA_SERVER_HOST: 0.0.0.0
      MANA_SERVER_PORT: 8787
      MANA_SQLITE_PATH: /data/mana.db
      MANA_STEAM_WEB_API_KEY: "${MANA_STEAM_WEB_API_KEY:?MANA_STEAM_WEB_API_KEY is required — add it to the root .env file (gitignored)}"
      MANA_STEAM_APP_IDS: "${MANA_STEAM_APP_IDS:-3757600,4233280}"
      # AuthenticateUserTicket endpoint. Defaults to the public endpoint, which
      # works with a standard Web API key (steamcommunity.com/dev/apikey). Set
      # MANA_STEAM_API_URL in .env to the partner endpoint when you have a
      # publisher Web API key instead.
      MANA_STEAM_API_URL: "${MANA_STEAM_API_URL:-https://api.steampowered.com/ISteamUserAuth/AuthenticateUserTicket/v1/}"
      MANA_CORS_ORIGIN: "${MANA_CORS_ORIGIN:-*}"
      MANA_ITCH_ENABLED: "${MANA_ITCH_ENABLED:-false}"
    volumes:
      - mana-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  mana-data:
  caddy-data:
  caddy-config:

