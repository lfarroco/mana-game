name: E2E Tests

on:
  push:
    branches: [ main ] # Adjust if your main branch is named differently (e.g., master)
  pull_request:
    branches: [ main ] # Adjust if your main branch is named differently

jobs:
  playwright-tests:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest # You can specify other OS if needed, e.g., windows-latest, macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x' # Specify your project's Node.js version
        cache: 'npm' # Enable caching for npm dependencies (uses package-lock.json)

    - name: Install dependencies
      run: npm ci # 'ci' is generally faster and more reliable for CI environments

    - name: Install Playwright browsers and OS dependencies
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      # This command runs your specific e2e test file.
      # If you have a script in your package.json (e.g., "test:e2e": "playwright test e2e/game.spec.ts"),
      # you could use: npm run test:e2e
      run: npx playwright test e2e/game.spec.ts 

    - name: Upload Playwright report
      # This step runs even if the tests fail, to help with debugging.
      if: always() 
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/ # Default path for Playwright HTML report
        retention-days: 7 # How long to keep the report