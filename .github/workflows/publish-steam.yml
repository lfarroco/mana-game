name: Publish to Steam

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Target app to publish'
        required: true
        default: demo
        type: choice
        options:
          - demo
          - full
      version:
        description: 'Optional build-description version (defaults to phaser/package.json)'
        required: false
        default: ''

# Secrets this workflow needs (repo → Settings → Secrets and variables → Actions):
#   STEAM_USERNAME    build-account Steam username
#   STEAM_CONFIG_VDF  base64 of the config.vdf with a cached Steam login (no MFA
#                     prompts). Generate it once locally: `steamcmd +login <user> <pass>`,
#                     complete the MFA email/code, then base64 the config.vdf file
#                     (macOS: ~/Library/Application Support/Steam/config/config.vdf;
#                     Linux: ~/.local/share/Steam/config/config.vdf). See
#                     steam/STEAM_UPLOAD.md §Automated / CI. Rotate it if compromised.
#   MANA_SERVER_URL   optional; defaults to https://api.manabattle.com
#
# How it works:
#   Job 1 builds the Electron app for all three platforms on macOS (the only OS
#   electron-builder can produce the macOS depot from) and uploads it as an
#   artifact. Job 2 downloads it and runs the repo's publish script on Ubuntu,
#   where Docker (the default steamcmd runner) mounts the cached-session
#   config.vdf into the container — no password or MFA prompts anywhere.

jobs:
  build:
    name: Build Electron (win + mac + linux)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: phaser/package-lock.json

      - name: Install dependencies
        working-directory: phaser
        run: npm ci

      - name: Run checks
        working-directory: phaser
        run: npm run test:ci && npm run typecheck

      - name: Build all platforms
        working-directory: phaser
        env:
          # Release builds must bake the production server URL.
          MANA_SERVER_URL: ${{ secrets.MANA_SERVER_URL || 'https://api.manabattle.com' }}
        run: |
          if [ "${{ inputs.app }}" = "demo" ]; then
            IS_DEMO=true npm run build
            IS_DEMO=true npx electron-builder --win --linux --dir --x64
            IS_DEMO=true npx electron-builder --mac --dir --universal
          else
            npm run build
            npx electron-builder --win --linux --dir --x64
            npx electron-builder --mac --dir --universal
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-electron
          path: phaser/dist-electron/
          retention-days: 7

  publish:
    name: Publish to Steam (${{ inputs.app }})
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-electron
          path: phaser/dist-electron

      - name: Publish to Steam
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_BUILD_DESC: ${{ inputs.version != '' && format('v{0}', inputs.version) || '' }}
          MANA_SKIP_BUILD: '1'
          MANA_SKIP_CHECKS: '1'
        run: |
          if [ "${{ inputs.app }}" = "demo" ]; then
            bash steam/scripts/publish_steam_demo.sh
          else
            bash steam/scripts/publish_steam.sh
          fi
