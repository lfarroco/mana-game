name: Platform Build Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-electron:
    name: Verify Electron (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: phaser/package-lock.json

      - name: Install dependencies
        working-directory: phaser
        run: npm ci

      - name: Verify Electron build
        working-directory: phaser
        run: npm run electron:build:${{ matrix.target }}

  verify-android:
    name: Verify Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: phaser/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: phaser
        run: npm ci

      - name: Sync Capacitor Android project
        working-directory: phaser
        run: npm run android:build

      - name: Assemble Android debug APK
        working-directory: phaser/android
        run: ./gradlew --no-daemon :app:assembleDebug
