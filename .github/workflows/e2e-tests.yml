name: E2E Tests

# Currently disabled for automatic runs to avoid unintended CI usage.
# To re-enable automatic runs, replace the `on:` block with one of the
# following options (uncomment the block you want):
#
#  1) Enable on push and pull_request for the main branch
#
#on:
#  push:
#    branches: [ main ]
#  pull_request:
#    branches: [ main ]
#
#  2) Enable push only (e.g., for main and release branches)
#
#on:
#  push:
#    branches: [ main, release/* ]
#
#  3) Keep manual trigger but add a repo secret toggle to opt-in runs.
#     - Create a repo secret named RUN_E2E with value "true" to allow runs.
#     - Add `if: ${{ secrets.RUN_E2E == 'true' }}` to the job or each step.
#
# Current configuration: manual run only via the Actions tab or API
on:
  workflow_dispatch: {}

jobs:
  playwright-tests:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest # You can specify other OS if needed, e.g., windows-latest, macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x' # Specify your project's Node.js version
        cache: 'npm'
        cache-dependency-path: phaser/package-lock.json # Path to package-lock.json within phaser/

    - name: Install dependencies
      working-directory: ./phaser
      run: npm ci

    - name: Install Playwright browsers and OS dependencies
      working-directory: ./phaser
      run: npx playwright install --with-deps # Installs browsers relative to the phaser/node_modules

    - name: Run Playwright tests
      working-directory: ./phaser
      # This command runs your specific e2e test file.
      # If you have a script in your package.json (e.g., "test:e2e": "playwright test e2e/game.spec.ts"),
      # you could use: npm run test:e2e
      # The path to e2e/game.spec.ts is now relative to the phaser/ directory.
      # If e2e/ is at the root, you might need ../e2e/game.spec.ts
      run: npm run test:e2e # Adjust path if e2e tests are not within phaser/

    - name: Upload Playwright report
      # This step runs even if the tests fail, to help with debugging.
      if: always() 
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: phaser/playwright-report/ # Path to report, now inside phaser/
        retention-days: 7 # How long to keep the report
