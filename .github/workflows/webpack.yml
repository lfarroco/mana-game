name: Build and Deploy Phaser App

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: phaser/package-lock.json

      - name: Install dependencies
        working-directory: phaser
        run: npm ci

      - name: Run unit tests (shard ${{ matrix.shard }}/2)
        working-directory: phaser
        run: npm run test:ci -- --shard=${{ matrix.shard }}/2

  build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # ✅ Essential step!

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: phaser/package-lock.json

      - name: Install dependencies
        working-directory: phaser
        run: npm ci

      - name: Build static files
        working-directory: phaser
        run: npm run build

      - name: Check bundle size
        working-directory: phaser
        run: npm run test:bundle-size

      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: phaser/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
